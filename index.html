<style>

on:column;gap:8px;min-height:0}.orderhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.orderhead span:last-child{font-size:11px;color:#6a8075}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex-shrink:0}.order{text-align:left;position:relative;border:2px solid #ddd9c9;border-radius:15px;background:#fffdf5;padding:10px 12px;transition:border-color .15s,background .15s;overflow:hidden}.order.selected{border-color:var(--green);background:#eaf1df}.order.warn{box-shadow:inset 0 0 0 1px #f36643}.oname{font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:4px;font-weight:900;white-space:nowrap}.oname small{font-size:10px;color:#718273}.ingredients{display:flex;align-items:center;gap:5px;margin:9px 0}.ingredient{flex:1;min-width:0;max-width:38px;width:38px;height:38px;display:grid;place-items:center;background:#f3edda;border-radius:10px;font-size:23px;position:relative}.ingredient.done{background:#cfe3b8;opacity:.6}.ingredient.done:after{content:'✓';position:absolute;right:-2px;bottom:-4px;font-size:16px;font-weight:900;color:#215340;background:#fff7e9;border-radius:50%;height:19px;width:19px;text-align:center}.patience{height:4px;background:#e4dece;border-radius:5px;overflow:hidden}.patience i{display:block;height:100%;background:var(--green)}.stage{position:relative;flex:1;min-height:80px;border:1px solid #d8dcca;border-radius:20px;overflow:hidden;background:#dae7ce}canvas{display:block;width:100%;height:100%;touch-action:none}.stage-tag{position:absolute;top:12px;left:16px;font-size:10px;letter-spacing:2px;font-weight:900;color:#476752;pointer-events:none}.badge{position:absolute;right:13px;top:10px;background:#fff8e9e8;padding:5px 9px;font-size:11px;font-weight:900;border-radius:9px;pointer-events:none}.notice{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;pointer-events:none;font-size:12px;font-weight:800;color:#315741;min-height:20px}.hint{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:#708276;flex-shrink:0}.tools{display:flex;gap:8px;align-items:center;flex-shrink:0}.perk{background:#f4ecd8;border:1px solid var(--line);padding:10px 13px;border-radius:12px;font-size:12px;font-weight:800;flex:1}.mini{width:40px;min-height:40px;background:#f4ecd8;border:1px solid var(--line);border-radius:12px;font-size:17px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-shrink:0}.control{padding:12px 5px;border-radius:12px;background:#e8e8da;font-size:13px;font-weight:900;min-height:44px}.control.primary{background:var(--coral);color:white}.control.auto{background:#dce8d3}.control.auto.on{background:var(--green);color:white}.footer{display:flex;justify-content:space-between;color:#789082;font-size:10px;flex-shrink:0}.overlay{position:absolute;inset:0;background:#fff7e9e8;backdrop-filter:blur(5px);z-index:5;display:flex;align-items:center;justify-content:center;border-radius:16px;padding:14px}.modal{width:min(100%,460px);text-align:center}.modal .stamp{display:inline-block;border:1px solid #e1d5b9;color:#738166;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:2px}.modal h1{font-size:clamp(28px,4.5vw,48px);letter-spacing:-2px;line-height:1.1;margin:13px 0;color:var(--green)}.modal h1 span{color:var(--coral)}.modal p{font-size:13px;line-height:1.65;margin:10px 0}.modal .steps{display:flex;gap:8px;margin:14px 0}.step{flex:1;background:#fffdf8;border:1px solid var(--line);border-radius:13px;padding:10px 3px;font-size:11px;font-weight:700}.step strong{display:block;font-size:25px;margin-bottom:5px}.modal .launch{background:var(--coral);color:#fff;border-radius:13px;font-size:14px;font-weight:900;padding:13px 25px;margin-top:6px}.modal .sub{font-size:10px;color:#6e8379;margin:10px 0 0}.scorebig{font-size:42px;font-weight:900;color:var(--coral)}.modal .close{background:#e6eddd;border-radius:10px;padding:10px 18px;margin-left:5px}.auto-indicator{color:var(--green)}
@media(max-width:600px){.app{padding: max(10px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px}.logo{font-size:20px}.visit{font-size:11px;padding:10px}.stat{padding:7px 10px}.stat b{font-size:20px}.stat .heart{font-size:17px}.orders{gap:6px}.order{padding:9px 7px;border-radius:12px}.oname{font-size:11px}.oname small{font-size:9px}.ingredient{width:29px;height:30px;font-size:18px;border-radius:8px}.ingredients{gap:3px;margin:8px 0}.perk{font-size:11px;padding:10px 5px}.control{font-size:12px;padding:11px 3px}.hint{font-size:10px}.footer{font-size:9px}.stage{border-radius:15px}.modal h1{font-size:37px}.modal p{font-size:12px}}
@media(max-height:560px){.app{gap:5px;padding:6px 14px}.brand .eyebrow,.footer,.hint{display:none}.logo{font-size:19px}.visit{padding:7px 10px}.stat{padding:4px 10px}.stat b{font-size:17px}.stat small{font-size:9px}.order{padding:6px 9px}.ingredients{margin:4px 0}.ingredient{height:26px;width:28px;font-size:18px}.tools .perk{padding:7px}.mini{min-height:32px;width:32px}.control{min-height:33px;padding:7px}.modal h1{font-size:29px;margin:7px 0}.modal h1 br{display:none}.modal .steps{display:none}.modal p{line-height:1.35}.modal p{font-size:11px;margin:5px 0}.modal .steps{margin:6px 0}.step{padding:5px}.step strong{font-size:20px}.modal .stamp,.modal .sub{display:none}.modal .launch{padding:9px 20px}.orderhead{font-size:10px}.play{gap:4px}}

<body>
<main class="app">
 <header class="brand"><div><div class="logo">오늘<span>한끼</span> <span style="color:#899d83;font-size:14px">/ EXPRESS</span></div><div class="eyebrow">FRESH FOOD · QUICK THINKING</div></div><a class="visit" href="https://windul2.github.io/OhNeulHanKki/" target="_blank" rel="noopener noreferrer">오늘한끼 방문 ↗</a></header>
 <div class="topline"><div class="stats"><div class="stat"><small>오늘의 점수 / 최고 <span id="best">0</span></small><b id="score">0</b></div><div class="stat"><small>남은 영업시간</small><b id="clock">90.0</b><small style="display:inline">초</small></div><div class="stat"><small>손님 만족도</small><b class="heart" id="hearts">♥♥♥♥♥</b></div></div></div>
 <div class="timebar"><i id="timefill"></i></div>
 <section class="play">
  <div class="orderhead"><span>도시락 주문 <span style="color:#93a488">· 하나를 선택하세요</span></span><span id="level">LEVEL 1</span></div>
  <div class="orders" id="orders"></div>
  <div class="stage"><canvas id="game" aria-label="움직이는 재료를 눌러 선택한 도시락을 완성하세요"></canvas><div class="stage-tag">THE FRESH CONVEYOR</div><div class="badge" id="combo">COMBO 0</div><div class="notice" id="notice">주문 선택 → 재료 터치 → 도시락 완성!</div></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
 </section>
 <div class="hint"><span>필요한 재료만 톡! 잘못 담으면 콤보가 끊겨요.</span><span id="autohint">PC: Q W E 주문 · 1~6 재료</span></div>
 <div class="tools"><button class="perk" id="freeze">❄ 시간 멈춤 <span id="freezeCount">2</span></button><button class="perk" id="chef">✨ 셰프 찬스 <span id="chefCount">2</span></button><button class="mini" id="sound" aria-label="소리 켜기" title="소리 켜기">🔇</button><button class="mini" id="help" aria-label="게임 방법" title="게임 방법">?</button></div>
 <nav class="controls" aria-label="게임 조작"><button class="control primary" id="start">▶ 시작</button><button class="control" id="pause">Ⅱ 정지</button><button class="control" id="reset">↺ 처음으로</button><button class="control auto" id="auto" aria-pressed="false">▷ 자동플레이</button></nav>
 <footer class="footer"><span>한끼 익스프레스 · 주문 조합 퍼즐</span><span>90초 동안 최고의 한끼를!</span></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const foods=[{emoji:'🍚',name:'밥',color:'#fffcf2'},{emoji:'🥩',name:'고기',color:'#ffe0d4'},{emoji:'🥦',name:'브로콜리',color:'#dceebd'},{emoji:'🍳',name:'달걀',color:'#fff2be'},{emoji:'🥕',name:'당근',color:'#ffe4be'},{emoji:'🍤',name:'새우',color:'#fbd8d0'}];
const menus=[{name:'든든 한끼',items:[0,1,2]},{name:'햇살 한끼',items:[0,3,4]},{name:'바다 한끼',items:[0,5,2]},{name:'알록 한끼',items:[3,2,4]},{name:'특별 한끼',items:[1,3,5]},{name:'담백 한끼',items:[0,2,4]}];
let W=800,H=320,dpr=1,state='ready',auto=false,sound=false,audio=null,best=0,score=0,served=0,hearts=5,time=90,selected=0,combo=0,maxCombo=0,level=1,orders=[],pieces=[],particles=[],floats=[],freezeUses=2,chefUses=2,freezeLeft=0,feverLeft=0,spawnClock=0,autoClock=0,noticeLeft=0,serial=0,last=performance.now(),animationTime=0,orderRenderClock=0;
try{best=Number(localStorage.getItem('ohneul-express-best-v1'))||0}catch(e){}
function rand(a,b){return a+Math.random()*(b-a)}
function tone(freq=600,duration=.07){if(!sound)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function unlock(){if(sound)tone(360,.025)}
function newOrder(){const m=menus[Math.floor(Math.random()*menus.length)];let items=m.items.slice();if(level>=4&&Math.random()<.4)items.push(m.items[Math.floor(Math.random()*3)]);let patience=Math.max(18,34-level*1.2);return{id:++serial,name:m.name,items,filled:items.map(()=>false),left:patience,max:patience};}
function reset(){state='ready';auto=false;score=served=combo=maxCombo=0;hearts=5;time=90;level=1;selected=0;pieces=[];particles=[];floats=[];freezeUses=chefUses=2;freezeLeft=feverLeft=0;spawnClock=autoClock=orderRenderClock=0;spawnLane=0;orders=[newOrder(),newOrder(),newOrder()];for(let lane=0;lane<3;lane++)for(let j=0;j<5;j++)pieces.push({x:(j+.5)/5,y:lane,food:(j+lane*2)%6,wobble:rand(0,6),id:++serial});setNotice('주문 선택 → 재료 터치 → 도시락 완성!',1000);renderOrders();sync();showIntro();}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe(canvas);
function laneY(lane){const top=Math.min(42,H*.19),bottom=Math.min(32,H*.13);return top+(H-top-bottom)*(lane+.5)/3}
function radius(){return Math.max(12,Math.min(32,(H-48)/7,W/12))}
function renderOrders(){const parent=$('orders');parent.replaceChildren();orders.forEach((o,i)=>{const b=document.createElement('button');b.className='order'+(i===selected?' selected':'')+(o.left/o.max<.24?' warn':'');b.setAttribute('aria-pressed',String(i===selected));b.setAttribute('aria-label',(i+1)+'번 '+o.name+', 필요한 재료 '+o.items.filter((f,j)=>!o.filled[j]).map(f=>foods[f].name).join(', '));const n=document.createElement('div');n.className='oname';n.textContent=o.name;const number=document.createElement('small');number.textContent='#'+o.id; n.append(number);b.append(n);const row=document.createElement('div');row.className='ingredients';o.items.forEach((f,j)=>{const s=document.createElement('span');s.className='ingredient'+(o.filled[j]?' done':'');s.textContent=foods[f].emoji;s.title=foods[f].name+(o.filled[j]?' 완료':' 필요');row.append(s)});b.append(row);const p=document.createElement('div');p.className='patience';const fill=document.createElement('i');fill.style.width=100*o.left/o.max+'%';if(o.left/o.max<.24)fill.style.background='#f36643';p.append(fill);b.append(p);b.addEventListener('click',()=>{if(state!=='running')return;selected=i;renderOrders();tone(420,.04)});parent.append(b);});}
function sync(){ $('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('clock').textContent=Math.max(0,time).toFixed(1);$('timefill').style.width=Math.max(0,time)/90*100+'%';$('hearts').textContent='♥'.repeat(Math.max(0,hearts))+'♡'.repeat(5-Math.max(0,hearts));$('level').textContent='LEVEL '+level+' · '+served+'개 완성';$('combo').textContent=feverLeft>0?'🔥 FEVER '+Math.ceil(feverLeft)+'초': 'COMBO '+combo;$('combo').style.color=feverLeft>0?'#e35d2f':'#315741';$('freezeCount').textContent=freezeUses;$('chefCount').textContent=chefUses;$('freeze').disabled=state!=='running'||freezeUses<=0||freezeLeft>0;$('chef').disabled=state!=='running'||chefUses<=0;$('pause').disabled=state!=='running';$('start').textContent=state==='paused'?'▶ 계속':state==='running'?'▶ 진행 중':'▶ 시작';$('start').disabled=state==='running';$('auto').classList.toggle('on',auto);$('auto').setAttribute('aria-pressed',String(auto));$('auto').textContent=auto?'◼ 자동 ON':'▷ 자동플레이';$('autohint').textContent=auto?'AUTO · 셰프가 주문을 처리하고 있어요':'PC: Q W E 주문 · 1~6 재료';}
function setNotice(text,seconds=2){$('notice').textContent=text;noticeLeft=seconds;}
function showIntro(){ $('overlay').hidden=false;$('modal').innerHTML='<span class="stamp">TODAY’S FRESH CHALLENGE</span><h1>한끼<br><span>익스프레스</span></h1><p>밀려오는 주문, 흘러가는 재료!<br>90초 동안 나만의 도시락 가게를 운영하세요.</p><div class="steps"><div class="step"><strong>📋</strong>주문 선택</div><div class="step"><strong>🥦</strong>재료 터치</div><div class="step"><strong>🍱</strong>자동 완성</div></div><button class="launch" id="launch">가게 문 열기 →</button><p class="sub">이 게임의 메뉴는 게임을 위한 가상 구성입니다.</p>';$('launch').onclick=start;}
function start(){unlock();if(state==='ended'){const keep=auto;reset();auto=keep;}state='running';last=performance.now();$('overlay').hidden=true;setNotice(auto?'자동 셰프 출근! 편하게 구경하세요.':'주문 하나를 고르고 필요한 재료를 눌러보세요.',3);sync();}
function pause(){if(state!=='running')return;state='paused';$('overlay').hidden=false;$('modal').innerHTML='<span class="stamp">TAKE A BREATH</span><h1>잠깐<br><span>쉬어가기</span></h1><p>주문과 시간이 멈췄어요.<br>준비되면 이어서 플레이하세요.</p><button class="launch" id="resume">계속 플레이 →</button>';$('resume').onclick=start;sync();}
function end(){state='ended';if(score>best){best=score;try{localStorage.setItem('ohneul-express-best-v1',String(best))}catch(e){}}const rank=served>=25?'전설의 한끼 장인':served>=15?'도시락 마스터':served>=7?'능숙한 셰프':'새내기 셰프';$('overlay').hidden=false;$('modal').innerHTML='<span class="stamp">SHIFT COMPLETE</span><h1>오늘도<br><span>잘 먹었습니다!</span></h1><div class="scorebig">'+score.toLocaleString()+'</div><p>'+rank+' · '+served+'개 완성<br>최대 '+maxCombo+'콤보 · '+(auto?'자동플레이 기록':'직접 플레이 기록')+'</p><button class="launch" id="again">한 번 더 도전 →</button><p class="sub">상단 ‘오늘한끼 방문’에서 오늘한끼를 만나보세요.</p>';$('again').onclick=start;sync();}
function burst(x,y,color){for(let i=0;i<14;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-130,40),life:rand(.4,.85),color});}
function take(piece){if(state!=='running'||!pieces.includes(piece))return;const o=orders[selected],idx=o.items.findIndex((f,j)=>f===piece.food&&!o.filled[j]),x=piece.x*W,y=laneY(piece.y);if(idx<0){combo=0;score=Math.max(0,score-15);o.left=Math.max(1,o.left-2);setNotice('앗! 선택한 주문에 필요한 재료를 골라주세요.',2);floats.push({x,y,text:'-15',color:'#cb5038',life:1});tone(160,.13);sync();return;}pieces.splice(pieces.indexOf(piece),1);o.filled[idx]=true;score+=10;burst(x,y,foods[piece.food].color);tone(500+idx*160,.06);if(o.filled.every(Boolean))complete(selected);renderOrders();sync();}
function complete(i){combo++;maxCombo=Math.max(maxCombo,combo);served++;const bonus=Math.round(100+Math.min(combo,10)*20+orders[i].left*2)*(feverLeft>0?2:1);score+=bonus;level=1+Math.floor(served/5);orders[i]=newOrder();floats.push({x:W/2,y:H*.42,text:'도시락 완성! +'+bonus,color:'#236650',life:1.4});burst(W/2,H*.4,'#f5a845');tone(900,.12);setNotice(combo+'콤보! '+(feverLeft>0?'피버 점수 2배!':'신선한 한끼가 완성됐어요.'),2.5);if(combo%5===0){feverLeft=9;setNotice('🔥 피버 타임! 9초 동안 점수 2배 · 손님 대기 정지!',3);} }
function freeze(){if(state!=='running'||freezeUses<=0||freezeLeft>0)return;freezeUses--;freezeLeft=5;setNotice('❄ 5초 동안 영업시간과 손님 대기시간이 멈춰요!',3);tone(1100,.15);sync();}
function chef(){if(state!=='running'||chefUses<=0)return;chefUses--;const o=orders[selected],j=o.filled.indexOf(false);if(j>=0){o.filled[j]=true;burst(W/2,H/2,'#fff2a1');if(o.filled.every(Boolean))complete(selected);else setNotice('✨ 셰프가 부족한 재료 하나를 채웠어요!',2);tone(1000,.09);}renderOrders();sync();}
let spawnLane=0;
function spawn(){const lane=spawnLane++%3;if(pieces.some(p=>p.y===lane&&p.x>.87))return;const needs=orders.flatMap(o=>o.items.filter((f,j)=>!o.filled[j]));const f=Math.random()<.8&&needs.length?needs[Math.floor(rand(0,needs.length))]:Math.floor(rand(0,6));pieces.push({x:1.09,y:lane,food:f,wobble:rand(0,6),id:++serial});}
function autoStep(){let candidates=[];orders.forEach((o,i)=>{pieces.forEach(p=>{if(p.x<.02||p.x>.98)return;if(o.items.some((f,j)=>f===p.food&&!o.filled[j]))candidates.push({i,p,priority:(1-o.left/o.max)*3+o.filled.filter(Boolean).length*.4+(1-p.x)*.5});});});if(candidates.length){candidates.sort((a,b)=>b.priority-a.priority);selected=candidates[0].i;take(candidates[0].p);}if(orders.some(o=>o.left<6)&&freezeUses>0&&freezeLeft<=0)freeze();if(!candidates.length&&orders[selected].left<8&&chefUses>0)chef();}
function update(dt){if(state!=='running')return;let frozen=freezeLeft>0;if(frozen)freezeLeft=Math.max(0,freezeLeft-dt);else time=Math.max(0,time-dt);feverLeft=Math.max(0,feverLeft-dt);if(!frozen&&feverLeft<=0){for(let i=0;i<orders.length;i++){orders[i].left-=dt;if(orders[i].left<=0){hearts--;combo=0;orders[i]=newOrder();setNotice('손님이 기다리다 떠났어요. 급한 주문부터!',3);tone(180,.16);renderOrders();if(hearts<=0){end();return;}}}}
if(time<=0){end();return;}const speed=(.10+level*.009)*(frozen?.45:1);for(const p of pieces)p.x-=speed*dt;pieces=pieces.filter(p=>p.x>-.12);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.43,.95-level*.045);}if(auto){autoClock-=dt;if(autoClock<=0){autoStep();autoClock=.23;}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;}particles=particles.filter(p=>p.life>0);for(const f of floats){f.life-=dt;f.y-=27*dt;}floats=floats.filter(f=>f.life>0);noticeLeft-=dt;if(noticeLeft<=0){$('notice').textContent=freezeLeft>0?'❄ 시간 멈춤 '+Math.ceil(freezeLeft)+'초':auto?'AUTO · 주문을 조합하는 중…':'주문 선택 → 필요한 재료를 눌러주세요';}
orderRenderClock+=dt;if(orderRenderClock>.15){const bars=$('orders').querySelectorAll('.patience i');bars.forEach((b,i)=>{b.style.width=Math.max(0,orders[i].left/orders[i].max*100)+'%';b.style.background=orders[i].left/orders[i].max<.24?'#f36643':'#246654';});orderRenderClock=0;}sync();}
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=feverLeft>0?'#f0e3b7':freezeLeft>0?'#d3e9e7':'#dce8d0';ctx.fillRect(0,0,W,H);const r=radius();for(let lane=0;lane<3;lane++){const y=laneY(lane),lh=r*2+14;roundRect(-10,y-lh/2,W+20,lh,lh/2,'#b7c4a8');roundRect(-10,y-lh/2+5,W+20,lh-10,lh/2,'#7d9278');ctx.save();ctx.beginPath();ctx.rect(0,y-lh/2,W,lh);ctx.clip();ctx.strokeStyle='#9db091';ctx.lineWidth=2;const offset=(animationTime*35)%45;for(let x=-45;x<W+45;x+=45){ctx.beginPath();ctx.moveTo(x-offset,y-lh/2+6);ctx.lineTo(x-offset-18,y+lh/2-6);ctx.stroke();}ctx.restore();}
const o=orders[selected];for(const p of pieces){const x=p.x*W,y=laneY(p.y)+Math.sin(animationTime*2+p.wobble)*2;const needed=o&&o.items.some((f,j)=>f===p.food&&!o.filled[j]);ctx.save();ctx.shadowColor='#18382426';ctx.shadowBlur=7;ctx.shadowOffsetY=4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=foods[p.food].color;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=needed?3:1;ctx.strokeStyle=needed?'#f5aa4d':'#edf0df';ctx.stroke();ctx.font=(r*1.25)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#24392e';ctx.fillText(foods[p.food].emoji,x,y+1);if(needed){ctx.beginPath();ctx.arc(x+r*.7,y-r*.68,5,0,Math.PI*2);ctx.fillStyle='#f36643';ctx.fill();}ctx.restore();}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='900 '+Math.min(20,W/20)+'px system-ui';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}ctx.globalAlpha=1;}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state==='running'||state==='ready')animationTime+=dt;update(dt);draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{if(state!=='running')return;e.preventDefault();unlock();const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,r=radius();let target=null,dist=Infinity;for(const p of pieces){const d=Math.hypot(p.x*W-x,laneY(p.y)-y);if(d<Math.max(r+8,23)&&d<dist){target=p;dist=d;}}if(target)take(target);});
$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=()=>{unlock();reset();};$('auto').onclick=()=>{unlock();auto=!auto;if(state==='ready'||state==='ended'||state==='paused')start();setNotice(auto?'자동 셰프가 출근했어요!':'직접 플레이로 전환했어요.',2);sync();};
$('freeze').onclick=freeze;$('chef').onclick=chef;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');tone(600,.1);};
$('help').onclick=()=>{if(state==='running')pause();const prior=state;$('overlay').hidden=false;$('modal').innerHTML='<span class="stamp">HOW TO PLAY</span><h1>톡톡!<br><span>한끼 완성</span></h1><p>주문 선택 → 필요한 재료 터치 → 도시락 완성!<br>틀린 재료: −15점, 대기 −2초, 콤보 초기화<br>5콤보 피버: 9초간 완성 점수 2배 · 손님 대기 정지<br>❄ 5초간 영업·대기 정지 / ✨ 재료 하나 채우기<br>PC: Q/W/E 주문, 1 밥 · 2 고기 · 3 브로콜리<br>4 달걀 · 5 당근 · 6 새우, F 멈춤, C 찬스</p><button class="launch" id="helpclose">'+(prior==='paused'?'계속 플레이':'닫기')+'</button>';$('helpclose').onclick=()=>{if(prior==='paused')start();else if(prior==='ready')showIntro();else if(prior==='ended')end();};};
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.tagName==='BUTTON'||e.target.tagName==='A')return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();state==='running'?pause():start();return;}if(state!=='running')return;const slot=['q','w','e'].indexOf(k);if(slot>=0){selected=slot;renderOrders();}if(/^[1-6]$/.test(k)){const f=Number(k)-1,p=pieces.filter(p=>p.food===f&&p.x>=0&&p.x<=1).sort((a,b)=>a.x-b.x)[0];if(p)take(p);}if(k==='f')freeze();if(k==='c')chef();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause();});$('game').title='1 밥 · 2 고기 · 3 브로콜리 · 4 달걀 · 5 당근 · 6 새우';document.querySelector('.visit').addEventListener('click',()=>{if(state==='running')pause();});
reset();resize();requestAnimationFrame(frame);
</script>
</body>
